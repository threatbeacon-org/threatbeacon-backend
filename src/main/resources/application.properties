# =================================================
# CORE APPLICATION SETTINGS
# =================================================
spring.application.name=threatbeacon-backend

# =================================================
# DATABASE DATASOURCE CONFIGURATION
# =================================================
# Driver for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection URL (read from environment variable)
spring.datasource.url=${DB_URL}

# Database user (read from environment variable)
spring.datasource.username=${DB_USER}

# Database password (read from environment variable)
spring.datasource.password=${DB_PASSWORD}

# =================================================
# JPA / HIBERNATE CONFIGURATION
# =================================================
# Use the PostgreSQL dialect for optimized SQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Let Flyway/Liquibase or manual scripts manage the schema. Avoids Hibernate auto-creating tables.
spring.jpa.hibernate.ddl-auto=none

# Optional: Show SQL statements in the console for debugging
# spring.jpa.show-sql=true

# =================================================
# DATABASE INITIALIZATION
# =================================================
# Always run initialization scripts (e.g., schema.sql, data.sql) on startup
spring.sql.init.mode=always

# =================================================
# SPRING AI (OPENAI) CONFIGURATION
# =================================================
# OpenAI API Key (read from environment variable)
spring.ai.openai.api-key=${OPENAI_API_KEY}
